[workspace]
# xtask: regenerates src/generated.rs from the schema (`cargo run -p xtask`).
members = [".", "xtask"]

[package]
name = "autoware_carla_scenario_rerun"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "Apache-2.0"
description = "Convert autoware_carla_scenario trajectory logs (*.trajectory.jsonl) into Rerun recordings (.rrd)"
repository = "https://github.com/hakuturu583/autoware_carla_scenario_rerun"
readme = "README.md"
publish = false

[lib]
name = "autoware_carla_scenario_rerun"
crate-type = ["rlib", "cdylib"]

[features]
default = []
# The Python extension module (maturin turns it on, see pyproject.toml).
python = ["dep:pyo3", "dep:pyo3-log"]

[dependencies]
# Pinned exactly: an .rrd is read by a viewer of the same minor version.
rerun = { version = "=0.38.1", default-features = false, features = ["sdk"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simd-json = "0.18"
memmap2 = "0.9"
memchr = "2"
rayon = "1"
quick-xml = "0.42"
thiserror = "2"
log = "0.4"
regress = "0.10"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"], optional = true }
pyo3-log = { version = "0.13", optional = true }

[dev-dependencies]
criterion = "0.7"
proptest = "1"
tempfile = "3"
env_logger = "0.11"

[[bench]]
name = "convert"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1
